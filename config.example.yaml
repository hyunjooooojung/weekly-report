# 주간 리포트 파이프라인 설정 (비민감 값만).
# 실제 사용 시 이 파일을 config.yaml 로 복사해 값을 채우세요.
# 토큰/비밀번호 같은 민감정보는 여기 두지 말고 환경변수(GitHub Secrets)로 주입합니다.

github:
  org: your-org                 # organization 이름
  repos:                        # 수집 대상 리포지토리 목록
    - repo-a
    - repo-b
  # branch: main                # (선택) 특정 브랜치만 볼 때 지정. 생략 시 기본 브랜치.

schedule:
  lookback_days: 7              # 최근 며칠간의 커밋을 수집할지 (기본 7일)

obsidian:
  vault_repo: your-owner/your-vault-repo   # 노트를 push 할 별도 vault git 레포 (owner/name)
  vault_branch: main                        # push 대상 브랜치
  notes_dir: "Weekly Reports"               # vault 내 노트 저장 폴더

confluence:
  base_url: https://your-site.atlassian.net/wiki   # /wiki 까지 포함
  space_key: TEAM                                   # 대상 space 의 key
  parent_page_id: ""                                # (선택) 부모 페이지 id. 없으면 최상위.
  title_template: "주간 개발 리포트 {week}"          # {week} 는 ISO 주차(YYYY-Www)로 치환

summarizer:
  enabled: true                # false 로 두면 AI 요약 생략, 원본 부록만 생성
  model: claude-opus-4-8
  language: ko
